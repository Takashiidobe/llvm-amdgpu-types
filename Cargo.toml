[package]
name = "llvm-amdgpu-types"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Typed RDNA 2 instructions generated from AMD ISA XML"
repository = "https://github.com/takashiidobe/llvm-amdgpu-types"
keywords = ["amdgpu", "llvm", "assembly", "gpu"]
categories = ["development-tools", "parser-implementations"]
include = [
  "src/**",
  "examples/**",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "amd-isa/LICENSE.txt",
]

[lib]
path = "src/lib.rs"
