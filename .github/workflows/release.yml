name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag and published version
        id: version
        shell: bash
        run: |
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          version="$(jq -er '.packages[] | select(.name == "llvm-amdgpu-types") | .version' <<< "$metadata")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

          encoded_version="$(jq -rn --arg v "$version" '$v|@uri')"
          status="$(curl -A "llvm-amdgpu-types-release" --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/llvm-amdgpu-types/$encoded_version")"
          if [ "$status" = "200" ]; then
            echo "llvm-amdgpu-types $version already exists on crates.io; skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected crates.io response: HTTP $status" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Check package
        run: cargo publish --dry-run --locked

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.version.outputs.publish == 'true'

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
